map $http_upgrade $qapi_connection_upgrade {
    default upgrade;
    ''      '';
}

log_format qapi_metrics '$time_iso8601 request_id=$request_id remote=$remote_addr '
                        'method=$request_method uri=$uri status=$status '
                        'request_length=$request_length bytes_sent=$bytes_sent '
                        'request_time=$request_time upstream_time=$upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name qapi.click api.qapi.click;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qapi.click api.qapi.click;

    ssl_certificate /etc/letsencrypt/live/qapi.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qapi.click/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:QAPI_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 32m;
    access_log /var/log/nginx/qapi_metrics.log qapi_metrics;

    location ^~ /debug/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    location = /qapi-logo.png {
        alias /opt/new-api/static/qapi-logo.png;
        default_type image/png;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $qapi_connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }
}
